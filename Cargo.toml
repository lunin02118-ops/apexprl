[workspace]
resolver = "2"
members = [
    "crates/apexprl-pow",
    "crates/apexprl-gpu",
    "crates/apexprl-stratum",
    "crates/apexprl-cli",
]
exclude = [
    "third_party/pearl",
    "third_party/pearl/plonky2",
    "third_party/pearl/zk-pow",
    "third_party/pearl/pearl-blake3",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "ISC"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.21"
bincode = "1.3.3"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam-channel = "0.5"
flate2 = "1.1"
libc = "0.2"
primitive-types = { version = "0.12.1", features = ["serde"] }
rayon = "1.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pearl-blake3 = { path = "third_party/pearl/pearl-blake3", features = ["serde"] }
zk-pow = { path = "third_party/pearl/zk-pow" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
